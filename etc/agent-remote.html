<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agents</title>
<style>
  :root {
    --bg: #111418; --panel: #1b2027; --panel-2: #232a33; --text: #e6e9ee;
    --muted: #8b95a3; --line: #2c3440; --accent: #4c8dff;
    --waiting: #f0a732; --busy: #4c8dff; --bg-waiting: #b58a3c; --unknown: #6b7480;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .view { display: none; height: 100%; flex-direction: column; }
  .view.active { display: flex; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line); min-height: 56px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .status { font-size: 13px; color: var(--muted); }
  .status.error { color: var(--error); }
  #list { flex: 1; overflow-y: auto; padding: 12px; display: flex;
    flex-direction: column; gap: 10px; }
  .card { display: flex; align-items: center; gap: 12px; width: 100%;
    text-align: left; background: var(--panel); border-radius: 14px;
    padding: 16px 14px; border-left: 6px solid var(--unknown); min-height: 72px; }
  .card:active { background: var(--panel-2); }
  .card.waiting { border-left-color: var(--waiting); }
  .card.background-waiting { border-left-color: var(--bg-waiting); }
  .card.busy { border-left-color: var(--busy); }
  .card .main { flex: 1; min-width: 0; }
  .card .name { font-size: 17px; font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .card .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .badge { font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: 4px 8px; border-radius: 8px;
    background: var(--panel-2); color: var(--muted); white-space: nowrap; }
  .badge.waiting { background: var(--waiting); color: #1a1200; }
  .badge.background-waiting { background: var(--bg-waiting); color: #1a1200; }
  .badge.busy { background: var(--busy); color: #fff; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  .back { background: var(--panel-2); border-radius: 10px; padding: 8px 12px;
    font-size: 18px; }
  /* Scroll anchoring would double the correction loadOlder makes. */
  #output { flex: 1; min-height: 0; overflow: auto; overflow-anchor: none;
    padding: 10px 12px; background: var(--bg); }
  .screen { margin: 0;
    font: 12px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; }
  .nowrap .screen { white-space: pre; word-break: normal; }
  /* One conversation: nothing around it changes its size.  A card lies
     over its bottom, and the status line is always there at one height. */
  #conversation { flex: 1; min-height: 0; display: flex; position: relative; }
  #status { flex: 0 0 44px; height: 44px; display: flex; align-items: center;
    gap: 8px; padding: 0 12px; background: var(--panel);
    border-top: 1px solid var(--line); }
  #status-text { flex: 1; min-width: 0; font-size: 13px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #card { display: none; position: absolute; z-index: 5; left: 8px; right: 8px;
    bottom: 8px; max-height: 70%; flex-direction: column;
    background: var(--panel); border: 2px solid var(--waiting);
    border-radius: 12px; box-shadow: 0 -4px 16px rgba(0,0,0,.5); }
  #card.open { display: flex; }
  #card-label { padding: 6px 12px 2px; font-size: 13px; font-weight: 600;
    color: var(--waiting); }
  #card-text { flex: 0 1 auto; min-height: 0; overflow: auto; padding: 0 12px 8px; }
  /* Without a transcript the whole screen is the only view. */
  #session-view.transcript #live { display: none; }
  #history-bar { display: none; align-items: center; gap: 10px; padding-bottom: 8px;
    font-size: 13px; color: var(--muted); }
  #history-bar.shown { display: flex; }
  #history-note { flex: 1; min-width: 0; }
  #older { flex: 0 0 auto; background: var(--panel-2); border-radius: 10px;
    padding: 8px 12px; font-size: 13px; }
  #older:disabled { opacity: .5; }
  .msg { font-size: 15px; line-height: 1.4; margin: 0 0 10px; white-space: pre-wrap;
    overflow-wrap: anywhere; }
  .msg.user { background: var(--panel-2); border-radius: 12px; padding: 8px 10px; }
  .msg.tool { font-size: 12px; color: var(--muted); }
  .msg .when { font-size: 11px; color: var(--muted); }
  .msg p, .msg ul, .msg ol, .msg blockquote, .msg h3, .msg h4, .msg h5, .msg hr,
  .msg .md-scroll { margin: 0 0 8px; }
  .msg > :last-child, .msg li > :last-child, .msg blockquote > :last-child
    { margin-bottom: 0; }
  .msg h3 { font-size: 18px; } .msg h4 { font-size: 16px; } .msg h5 { font-size: 15px; }
  .msg ul, .msg ol { padding-left: 22px; }
  .msg blockquote { border-left: 3px solid var(--line); padding-left: 10px;
    color: var(--muted); }
  .msg hr { border: 0; border-top: 1px solid var(--line); }
  .msg a { color: var(--accent); }
  .msg .md-url { font-size: 12px; color: var(--muted); }
  .msg code { font: 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: var(--line); border-radius: 4px; padding: 1px 4px; }
  /* Wide code and tables scroll by themselves; the page stays phone width. */
  .msg .md-scroll { overflow-x: auto; }
  .msg pre { margin: 0; padding: 8px 10px; white-space: pre; overflow-wrap: normal;
    background: var(--line); border-radius: 8px; }
  .msg pre code { background: none; padding: 0; }
  .msg .md-lang { font-size: 11px; color: var(--muted); }
  .msg table { border-collapse: collapse; font-size: 14px; }
  .msg th, .msg td { border: 1px solid var(--line); padding: 4px 8px;
    overflow-wrap: normal; min-width: 4em; max-width: 22em; vertical-align: top; }
  .keys { display: flex; gap: 14px; padding: 8px 10px 0; overflow-x: auto;
    background: var(--panel); border-top: 1px solid var(--line); }
  .key-group { display: flex; flex: 0 0 auto; gap: 2px; }
  .key { flex: 0 0 auto; min-width: 44px; height: 44px; padding: 0 10px;
    background: var(--panel-2); font-size: 16px; }
  .key:first-child { border-radius: 10px 0 0 10px; }
  .key:last-child { border-radius: 0 10px 10px 0; }
  .key:only-child { border-radius: 10px; }
  .key:active { background: var(--line); }
  .compose { display: flex; gap: 8px; padding: 8px 10px 10px;
    background: var(--panel); align-items: flex-end;
    padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  textarea { flex: 1; resize: none; min-height: 44px; max-height: 40vh;
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; font: inherit; }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .send { height: 44px; padding: 0 18px; border-radius: 12px;
    background: var(--accent); color: #fff; font-weight: 600; }
  .send:disabled { opacity: .5; }
  .title { flex: 1; min-width: 0; display: flex; flex-direction: column;
    align-items: flex-start; gap: 3px; }
  .title h1 { flex: none; max-width: 100%; }
  .title .badge { font-size: 10px; padding: 2px 6px; }
  .actions-bar { display: flex; gap: 6px; flex: 0 0 auto; }
  .toggle { background: var(--panel-2); border-radius: 10px; padding: 8px 9px;
    font-size: 13px; }
  .toggle.danger { color: var(--error); }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: flex-end; }
  .sheet.open { display: flex; }
  .sheet .panel { width: 100%; max-height: 80vh; overflow-y: auto;
    background: var(--panel); border-radius: 16px 16px 0 0; padding: 14px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px; }
  .sheet h2 { font-size: 16px; margin: 0 0 4px; }
  .sheet .note { font-size: 13px; color: var(--muted); margin: 0; }
  .choice { display: flex; align-items: center; gap: 10px; width: 100%;
    text-align: left; background: var(--panel-2); border-radius: 12px;
    padding: 12px; min-height: 56px; border: 2px solid transparent; }
  .choice.picked { border-color: var(--accent); }
  .choice:disabled { opacity: .45; }
  .choice .main { flex: 1; min-width: 0; }
  .choice .meta { font-size: 13px; color: var(--muted); }
  .choice .meta.limited { color: var(--error); }
  .sheet .actions { display: flex; gap: 8px; margin-top: 4px; }
  .sheet .actions button { flex: 1; height: 48px; border-radius: 12px;
    background: var(--panel-2); font-weight: 600; }
  .sheet .actions .go { background: var(--accent); color: #fff; }
  .sheet .actions .go:disabled { opacity: .5; }
</style>
</head>
<body>
<section id="list-view" class="view active">
  <header>
    <h1>Sessions</h1>
    <span id="list-status" class="status"></span>
  </header>
  <div id="list"></div>
</section>

<section id="session-view" class="view">
  <header>
    <button class="back" id="back" aria-label="Back">‹</button>
    <div class="title">
      <h1 id="session-title"></h1>
      <span id="session-badge" class="badge"></span>
    </div>
    <div class="actions-bar">
      <button class="toggle" id="wrap">Wrap</button>
      <button class="toggle" id="new">New</button>
      <button class="toggle" id="restart">Restart</button>
      <button class="toggle danger" id="exit">Exit</button>
    </div>
  </header>
  <div id="conversation">
    <div id="output">
      <div id="history-bar">
        <span id="history-note"></span>
        <button id="older">Load older</button>
      </div>
      <div id="messages"></div>
      <div id="writing"></div>
      <pre id="live" class="screen"></pre>
    </div>
    <div id="card">
      <div id="card-label">Waiting on you</div>
      <pre id="card-text" class="screen"></pre>
    </div>
  </div>
  <div id="status"><span id="status-text"></span></div>
  <div class="keys" id="keys"></div>
  <div class="compose">
    <textarea id="text" rows="1" placeholder="Reply…"></textarea>
    <button class="send" id="send">Send</button>
  </div>
</section>

<div class="sheet" id="restart-sheet">
  <div class="panel">
    <h2>Restart with account</h2>
    <p class="note" id="restart-note"></p>
    <div id="choices"></div>
    <div class="actions">
      <button id="restart-cancel">Cancel</button>
      <button class="go" id="restart-go" disabled>Restart</button>
    </div>
  </div>
</div>

<div class="sheet" id="new-sheet">
  <div class="panel">
    <h2>New session</h2>
    <p class="note" id="new-note"></p>
    <div id="backends"></div>
    <div class="actions">
      <button class="cancel">Cancel</button>
    </div>
  </div>
</div>

<div class="sheet" id="exit-sheet">
  <div class="panel">
    <h2>Exit session</h2>
    <p class="note" id="exit-note"></p>
    <button class="choice" id="exit-skills">
      <div class="main"><div>Exit</div>
        <div class="meta">Run the before-exit skills, then exit.</div></div>
    </button>
    <button class="choice" id="exit-plain">
      <div class="main"><div>Exit without skills</div>
        <div class="meta">Exit now, skipping the before-exit skills.</div></div>
    </button>
    <div class="actions">
      <button class="cancel">Cancel</button>
    </div>
  </div>
</div>

<script>
"use strict";
// Grouped by purpose: interrupt, move through a menu, pick an option
// by number or letter, and cycle modes.
const KEY_GROUPS = [
  [["esc", "Esc"], ["ctrl-c", "^C"]],
  [["up", "↑"], ["down", "↓"], ["enter", "Enter"]],
  [["1", "1"], ["2", "2"], ["3", "3"]],
  [["y", "y"], ["n", "n"]],
  [["shift-tab", "⇧Tab"], ["tab", "Tab"]]
];
const STATE_LABEL = { "waiting": "waiting", "background-waiting": "bg work",
                      "busy": "busy", "unknown": "?" };
const STATE_ORDER = { "waiting": 0, "background-waiting": 1, "unknown": 2, "busy": 3 };
let current = null;
let timer = null;
// The conversation loaded above the live screen, reset per session.
let past = null;

const $ = (id) => document.getElementById(id);

// An unreachable Tailscale peer drops packets rather than refusing them,
// so without a deadline a poll hangs for minutes and the page never
// reports that it is offline.  Only reads get one: a timed-out POST
// such as a restart may still have taken effect.
const POLL_TIMEOUT_MS = 8000;

async function api(path, body) {
  const options = body === undefined
    ? { signal: AbortSignal.timeout(POLL_TIMEOUT_MS) }
    : {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Agent-Remote": "1" },
        body: JSON.stringify(body)
      };
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

function age(changed) {
  if (!changed) return "";
  const s = Math.max(0, Math.floor(Date.now() / 1000 - changed));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}

function setStatus(id, text, isError) {
  const el = $(id);
  el.textContent = text;
  el.classList.toggle("error", !!isError);
}

async function refreshList() {
  try {
    const { sessions } = await api("/api/sessions");
    sessions.sort((a, b) =>
      (STATE_ORDER[a.state] ?? 9) - (STATE_ORDER[b.state] ?? 9) ||
      (b.changed || 0) - (a.changed || 0));
    const list = $("list");
    list.replaceChildren();
    if (!sessions.length) {
      list.innerHTML = '<p class="empty">No sessions running.</p>';
    }
    for (const s of sessions) list.appendChild(card(s));
    setStatus("list-status", "");
  } catch (e) {
    setStatus("list-status", "Offline", true);
  }
}

function card(s) {
  const button = document.createElement("button");
  button.className = "card " + s.state;
  const main = document.createElement("div");
  main.className = "main";
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = s.name;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = [s.backend, s.account, age(s.changed), s.snoozed ? "snoozed" : ""]
    .filter(Boolean).join(" · ");
  main.append(name, meta);
  const badge = document.createElement("span");
  badge.className = "badge " + s.state;
  badge.textContent = STATE_LABEL[s.state] || s.state;
  button.append(main, badge);
  button.addEventListener("click", () => openSession(s));
  return button;
}

function show(viewId) {
  for (const v of document.querySelectorAll(".view"))
    v.classList.toggle("active", v.id === viewId);
}

function openSession(s) {
  current = s.id;
  $("session-title").textContent = s.name;
  resetSessionView();
  show("session-view");
  history.pushState({ session: s.id }, "");
  loadOlder().then(() => refreshSession(true));
  schedule();
}

function resetSessionView() {
  past = { before: null, after: null, size: 0, loading: false, available: true,
           failed: false, redacted: true, session: null, polls: 0, writing: null,
           overlay: 0 };
  $("live").textContent = "";
  $("card-text").textContent = "";
  $("card").classList.remove("open");
  $("status-text").textContent = "";
  $("writing").replaceChildren();
  $("output").style.paddingBottom = "";
  $("messages").replaceChildren();
  $("history-bar").classList.remove("shown");
  applyViewMode();
}

function hasTranscript() {
  return past.available && past.after !== null;
}

function applyViewMode() {
  $("session-view").classList.toggle("transcript", hasTranscript());
}

function closeSession() {
  closeSheets();
  current = null;
  show("list-view");
  refreshList();
  schedule();
}

async function refreshSession(forceBottom) {
  if (!current) return;
  const id = current;
  const state = past;
  const after = hasTranscript() ? state.after : null;
  try {
    const query = "/api/output?id=" + encodeURIComponent(id)
      + (after === null ? "" : "&after=" + after);
    const data = await api(query);
    if (id !== current || state !== past) return;
    $("session-title").textContent = data.name;
    const out = $("output");
    const atBottom = isOutputAtBottom();
    const live = $("live");
    const screen = safeGlyphs(data.output);
    if (live.textContent !== screen) live.textContent = screen;
    const session = data.history && data.history.session;
    if (session && state.session && session !== state.session) {
      resetSessionView();
      loadOlder();
      return;
    }
    if (data.history && after === state.after) applyNewHistory(data.history);
    renderScreenState(data, forceBottom);
    if (forceBottom || atBottom) scrollOutputToBottom();
    const badge = $("session-badge");
    badge.className = "badge " + data.state;
    badge.textContent = STATE_LABEL[data.state] || data.state;
    retryIfUnavailable();
  } catch (e) {
    if (id !== current) return;
    // An exited session disappears; go back to the list.
    if (e.message.startsWith("No such session")) { history.back(); return; }
    const badge = $("session-badge");
    badge.className = "badge";
    badge.textContent = "offline";
  }
}

function isAtBottom(el) {
  return el.scrollHeight - el.scrollTop - el.clientHeight < 40;
}

// The padding an overlay adds lets what lies under it be scrolled into
// view.  It is not part of the conversation's bottom.
function isOutputAtBottom() {
  const out = $("output");
  return out.scrollHeight - past.overlay - out.scrollTop - out.clientHeight < 40;
}

function scrollOutputToBottom() {
  const out = $("output");
  out.scrollTop = out.scrollHeight - past.overlay - out.clientHeight;
}

function setOverlay(height) {
  if (height === past.overlay) return;
  past.overlay = height;
  $("output").style.paddingBottom = height ? height + 18 + "px" : "";
}

// A session has no transcript until its first prompt.
function retryIfUnavailable() {
  if (past.available || ++past.polls % 10) return;
  past.available = true;
  past.before = null;
  loadOlder();
}

function applyNewHistory(data) {
  appendMessages(data.messages, data.gap);
  if (data.gap) past.before = data.before;
  past.after = data.after;
  past.size = data.size;
  past.redacted = data.redacted;
  if (data.messages.length) renderHistoryBar();
}

function renderScreenState(data, forceBottom) {
  const state = data.screen || {};
  const running = data.state === "busy" || state.running === true;
  const status = running ? state.status || "Working…" : state.mode || "";
  if ($("status-text").textContent !== status) $("status-text").textContent = status;
  renderWriting(running && hasTranscript() ? state.writing : null);
  renderCard(hasTranscript() ? state.card : null, forceBottom);
}

// Text the transcript does not hold yet ends the conversation as one more
// message, until the real one takes its place.
function renderWriting(text) {
  const shown = text && !isInTranscript(text) ? text : null;
  if (shown === past.writing) return;
  past.writing = shown;
  const box = $("writing");
  box.replaceChildren();
  if (shown) box.append(messageElement({ role: "assistant", text: shown }));
}

function renderCard(text, forceBottom) {
  const card = $("card");
  const body = $("card-text");
  const atBottom = isAtBottom(body);
  const content = text ? compactScreen(text.split("\n")) : "";
  if (body.textContent !== content) body.textContent = content;
  card.classList.toggle("open", !!text);
  if (text && (forceBottom || atBottom)) body.scrollTop = body.scrollHeight;
  setOverlay(text ? card.offsetHeight : 0);
}

// Android's fonts lack these, which would show as empty boxes.
function safeGlyphs(text) {
  const map = { "⏵": ">", "⏴": "<", "⏸": "||", "⏹": "[]", "⏺": "●" };
  return text.replace(/[⏵⏴⏸⏹⏺]/g, (glyph) => map[glyph]);
}

// Fits terminal lines to a phone without losing text: a full-width rule
// would wrap to several lines, right-aligned text to a line of spaces,
// and screens pad with blank lines.
function compactScreen(lines) {
  return lines.map((line) => safeGlyphs(line).trimEnd()
                   .replace(/^[─▔╌]{20,}/, (rule) => rule.slice(0, 30))
                   .replace(/^[ \u00a0]{20,}/, "  "))
    .join("\n")
    .replace(/^\n+/, "")
    .replace(/\n{3,}/g, "\n\n");
}

// Reports whether the transcript already holds a message shown on the
// screen.  Rendering rewraps and restyles text, so only letters and
// digits are compared, and a message that does not match is shown again
// rather than risk hiding what is still being written.
function isInTranscript(text) {
  const head = comparable(text).slice(0, 40);
  if (!head) return true;
  return [...$("messages").children].slice(-6)
    .some((el) => comparable(el.textContent).includes(head));
}

function comparable(text) {
  return text.replace(/[^\p{L}\p{N}]/gu, "");
}

// Stop asking after this many stretches of a transcript with no text,
// which is what a long run of tool output looks like.
const MAX_EMPTY_STRETCHES = 8;

async function fetchPast(id, params) {
  const query = new URLSearchParams({ id, ...params });
  return api("/api/history?" + query);
}

function messageElement(m) {
  const el = document.createElement("div");
  el.className = "msg " + m.role;
  if (m.role === "user" && m.time) {
    const when = document.createElement("div");
    when.className = "when";
    when.textContent = new Date(m.time).toLocaleString(
      [], { dateStyle: "short", timeStyle: "short" });
    el.appendChild(when);
  }
  el.append(m.role === "tool" ? m.text : renderMarkdown(m.text));
  return el;
}

// Markdown.  Every node is built with createElement and text nodes, never
// from markup: a transcript holds arbitrary text.  What is not well formed
// stays as text, and past these sizes, where some scans would turn
// quadratic, so does everything.
const MD_MAX_MESSAGE = 200000;
const MD_MAX_INLINE = 20000;
const MD_MAX_DEPTH = 8;
const MD_FENCE = /^ {0,3}(`{3,}|~{3,})(.*)$/;
const MD_HEADING = /^ {0,3}(#{1,6})[ \t]+(.*)$/;
const MD_RULE = /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/;
const MD_QUOTE = /^ {0,3}> ?(.*)$/;
const MD_LIST = /^( *)([-*+]|\d{1,9}[.)])( +)(.*)$/;
const MD_TABLE_RULE = /^[ \t]*\|?[ \t]*:?-+:?[ \t]*(?:\|[ \t]*:?-+:?[ \t]*)*\|?[ \t]*$/;

function node(tag, ...children) {
  const el = document.createElement(tag);
  el.append(...children);
  return el;
}

function renderMarkdown(text) {
  const fragment = document.createDocumentFragment();
  if (text.length > MD_MAX_MESSAGE) { fragment.append(text); return fragment; }
  try {
    renderBlocks(text.split(/\r?\n/), fragment, 0);
  } catch (e) {
    fragment.replaceChildren(text);
  }
  return fragment;
}

function renderBlocks(lines, parent, depth) {
  if (depth > MD_MAX_DEPTH) { parent.append(lines.join("\n")); return; }
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if (!line.trim()) {
      i++;
    } else if ((m = line.match(MD_FENCE)) && !(m[1][0] === "`" && m[2].includes("`"))) {
      i = renderFence(lines, i, m, parent);
    } else if ((m = line.match(MD_HEADING))) {
      const heading = node("h" + Math.min(m[1].length + 2, 5));
      renderInline(m[2], heading, 0);
      parent.append(heading);
      i++;
    } else if (MD_RULE.test(line)) {
      parent.append(node("hr"));
      i++;
    } else if (MD_QUOTE.test(line)) {
      const inner = [];
      for (; i < lines.length && (m = lines[i].match(MD_QUOTE)); i++) inner.push(m[1]);
      const quote = node("blockquote");
      renderBlocks(inner, quote, depth + 1);
      parent.append(quote);
    } else if (MD_LIST.test(line)) {
      i = renderList(lines, i, parent, depth);
    } else if (isTableStart(lines, i)) {
      i = renderTable(lines, i, parent);
    } else {
      const start = i++;
      while (i < lines.length && lines[i].trim() && !startsBlock(lines, i)) i++;
      const paragraph = node("p");
      renderInline(lines.slice(start, i).join("\n"), paragraph, 0);
      parent.append(paragraph);
    }
  }
}

function startsBlock(lines, i) {
  const line = lines[i];
  return MD_FENCE.test(line) || MD_HEADING.test(line) || MD_RULE.test(line)
    || MD_QUOTE.test(line) || MD_LIST.test(line) || isTableStart(lines, i);
}

// An unclosed fence runs to the end of the message.
function renderFence(lines, start, open, parent) {
  const close = new RegExp("^ {0,3}" + open[1][0] + "{" + open[1].length + ",}[ \\t]*$");
  let end = start + 1;
  while (end < lines.length && !close.test(lines[end])) end++;
  const language = open[2].trim();
  if (language) parent.append(node("div", language));
  if (language) parent.lastChild.className = "md-lang";
  const scroll = node("div", node("pre", node("code", lines.slice(start + 1, end).join("\n"))));
  scroll.className = "md-scroll";
  parent.append(scroll);
  return end + 1;
}

function renderList(lines, start, parent, depth) {
  const first = lines[start].match(MD_LIST);
  const ordered = /\d/.test(first[2]);
  const list = node(ordered ? "ol" : "ul");
  if (ordered) list.start = parseInt(first[2], 10);
  const indent = first[1].length;
  let i = start;
  while (i < lines.length) {
    const m = lines[i].match(MD_LIST);
    if (!m || MD_RULE.test(lines[i]) || m[1].length < indent
        || /\d/.test(m[2]) !== ordered) break;
    const body = [m[4]];
    const content = m[1].length + m[2].length + (m[3].length > 4 ? 1 : m[3].length);
    i++;
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) {
        let next = i + 1;
        while (next < lines.length && !lines[next].trim()) next++;
        if (next === lines.length || leadingSpaces(lines[next]) < content) break;
        body.push("");
      } else if (leadingSpaces(line) >= content) {
        body.push(line.slice(content));
      } else if (startsBlock(lines, i)) {
        break;
      } else {
        body.push(line.trim());
      }
      i++;
    }
    const item = node("li");
    renderBlocks(body, item, depth + 1);
    list.append(item);
    while (i < lines.length && !lines[i].trim()) i++;
  }
  parent.append(list);
  return i;
}

function leadingSpaces(line) {
  return line.length - line.trimStart().length;
}

function isTableStart(lines, i) {
  return i + 1 < lines.length && lines[i].includes("|")
    && MD_TABLE_RULE.test(lines[i + 1])
    && splitRow(lines[i]).length === splitRow(lines[i + 1]).length;
}

function renderTable(lines, start, parent) {
  const aligns = splitRow(lines[start + 1]).map((cell) =>
    /^:-+:$/.test(cell) ? "center" : /-:$/.test(cell) ? "right" : "");
  const row = (line, tag) => {
    const tr = node("tr");
    splitRow(line).forEach((text, column) => {
      const cell = node(tag);
      if (aligns[column]) cell.style.textAlign = aligns[column];
      renderInline(text, cell, 0);
      tr.append(cell);
    });
    return tr;
  };
  const body = node("tbody");
  let i = start + 2;
  for (; i < lines.length && lines[i].trim() && lines[i].includes("|"); i++)
    body.append(row(lines[i], "td"));
  const scroll = node("div", node("table", node("thead", row(lines[start], "th")), body));
  scroll.className = "md-scroll";
  parent.append(scroll);
  return i;
}

// Splits on pipes that are neither escaped nor in a code span.
function splitRow(line) {
  const text = line.trim().replace(/^\|/, "");
  const cells = [];
  let cell = "";
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === "\\") {
      cell += ch + (text[i + 1] ?? "");
      i++;
    } else if (ch === "`") {
      const end = codeSpanEnd(text, i);
      if (end === -1) { cell += ch; continue; }
      cell += text.slice(i, end);
      i = end - 1;
    } else if (ch === "|") {
      cells.push(cell.trim());
      cell = "";
    } else {
      cell += ch;
    }
  }
  if (cell.trim() || !text.endsWith("|")) cells.push(cell.trim());
  return cells;
}

// Returns the index just past the code span opening at START, or -1.
function codeSpanEnd(text, start) {
  let open = start;
  while (text[open] === "`") open++;
  const run = open - start;
  let i = open;
  while ((i = text.indexOf("`", i)) !== -1) {
    let end = i;
    while (text[end] === "`") end++;
    if (end - i === run) return end;
    i = end;
  }
  return -1;
}

const MD_ALNUM = /[\p{L}\p{N}]/u;
const MD_ESCAPABLE = /[!-\/:-@\[-`{-~]/;
const MD_BARE_URL = /https?:\/\/[^\s<>]+/iy;

function renderInline(text, parent, depth, inLink) {
  if (text.length > MD_MAX_INLINE || depth > MD_MAX_DEPTH) { parent.append(text); return; }
  // A failed search for a closer would fail again from further on, so each
  // kind of marker is searched for in vain at most once.
  const unclosed = new Set();
  let plain = "";
  const flush = () => { if (plain) parent.append(plain); plain = ""; };
  const add = (el, next) => { flush(); parent.append(el); return next; };
  let i = 0;
  while (i < text.length) {
    const ch = text[i];
    let next = -1;
    if (ch === "\\" && MD_ESCAPABLE.test(text[i + 1] ?? "")) {
      plain += text[i + 1];
      next = i + 2;
    } else if (ch === "`") {
      const end = codeSpanEnd(text, i);
      if (end !== -1) next = add(codeElement(text, i, end), end);
      // An unclosed run stays literal, as does each of its backticks.
      else while (text[i + 1] === "`") { plain += ch; i++; }
    } else if (ch === "*" || ch === "_") {
      next = renderEmphasis(text, i, ch, parent, depth, inLink, unclosed, flush);
    } else if (!inLink && ch === "[" && !unclosed.has("[")) {
      next = renderLink(text, i, parent, depth, unclosed, flush);
    } else if (!inLink && ch === "<") {
      const end = text.indexOf(">", i);
      const url = end === -1 ? null : safeUrl(text.slice(i + 1, end));
      if (url) next = add(linkElement(url, text.slice(i + 1, end)), end + 1);
    } else if (!inLink && (ch === "h" || ch === "H") && !MD_ALNUM.test(text[i - 1] ?? "")) {
      MD_BARE_URL.lastIndex = i;
      const m = MD_BARE_URL.exec(text);
      const raw = m && trimUrl(m[0]);
      const url = raw && safeUrl(raw);
      if (url) next = add(linkElement(url, raw), i + raw.length);
    }
    if (next === -1) { plain += ch; next = i + 1; }
    i = next;
  }
  flush();
}

function codeElement(text, start, end) {
  let run = 0;
  while (text[start + run] === "`") run++;
  let code = text.slice(start + run, end - run);
  if (/^ .*[^ ].* $|^ [^ ] $/s.test(code)) code = code.slice(1, -1);
  return node("code", code);
}

// Renders the emphasis opening at START and returns where it ends, or -1.
function renderEmphasis(text, start, ch, parent, depth, inLink, unclosed, flush) {
  const token = text[start + 1] === ch ? ch + ch : ch;
  if (unclosed.has(token)) return -1;
  const after = text[start + token.length] ?? "";
  if (!after || /\s/.test(after)) return -1;
  if (ch === "_" && MD_ALNUM.test(text[start - 1] ?? "")) return -1;
  const close = findCloser(text, start + token.length, token, ch);
  if (close === -1) { unclosed.add(token); return -1; }
  const el = node(token.length === 2 ? "strong" : "em");
  renderInline(text.slice(start + token.length, close), el, depth + 1, inLink);
  flush();
  parent.append(el);
  return close + token.length;
}

function findCloser(text, from, token, ch) {
  for (let i = from; i < text.length; i++) {
    if (text[i] === "\\") { i++; continue; }
    if (text[i] === "`") {
      const end = codeSpanEnd(text, i);
      if (end !== -1) { i = end - 1; continue; }
      while (text[i + 1] === "`") i++;
      continue;
    }
    if (!text.startsWith(token, i) || i === from) continue;
    // In a run such as "***", the closer is its last characters.
    while (text[i + token.length] === ch) i++;
    if (/\s/.test(text[i - 1])) continue;
    if (ch === "_" && MD_ALNUM.test(text[i + token.length] ?? "")) continue;
    return i;
  }
  return -1;
}

// Renders "[label](url)" at START and returns where it ends, or -1.  With
// a URL other than http(s), all of it stays as text.
function renderLink(text, start, parent, depth, unclosed, flush) {
  let level = 0;
  let i = start;
  for (; i < text.length; i++) {
    if (text[i] === "\\") { i++; continue; }
    if (text[i] === "`") {
      const end = codeSpanEnd(text, i);
      if (end !== -1) i = end - 1;
      continue;
    }
    if (text[i] === "[") level++;
    if (text[i] === "]" && --level === 0) break;
  }
  if (i >= text.length) { unclosed.add("["); return -1; }
  if (text[i + 1] !== "(") return -1;
  let parens = 0;
  let end = i + 1;
  for (; end < text.length; end++) {
    if (/\s/.test(text[end])) return -1;
    if (text[end] === "(") parens++;
    if (text[end] === ")" && --parens === 0) break;
  }
  if (end >= text.length) return -1;
  const raw = text.slice(i + 2, end);
  const url = safeUrl(raw);
  if (!url) return -1;
  const label = text.slice(start + 1, i);
  flush();
  parent.append(...linkNodes(url, raw, label, depth));
  return end + 1;
}

function linkElement(url, raw) {
  const fragment = document.createDocumentFragment();
  fragment.append(...linkNodes(url, raw, raw, 0));
  return fragment;
}

// The Android app cancels navigation to other origins, so there a link
// cannot be followed and its address is the only way to reach it.
function linkNodes(url, raw, label, depth) {
  const link = node("a");
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  renderInline(label, link, depth + 1, true);
  if (label === raw || !/; wv\)/.test(navigator.userAgent)) return [link];
  const address = node("span", " (" + raw + ")");
  address.className = "md-url";
  return [link, address];
}

function safeUrl(raw) {
  if (!/^https?:\/\/[^\s\u0000-\u001f]+$/i.test(raw)) return null;
  try {
    const url = new URL(raw);
    return url.protocol === "http:" || url.protocol === "https:" ? url.href : null;
  } catch (e) {
    return null;
  }
}

// Leaves sentence punctuation and an unopened bracket out of a bare URL.
function trimUrl(raw) {
  let url = raw.replace(/[.,;:!?'"]+$/, "");
  while (url.endsWith(")") && url.split(")").length > url.split("(").length)
    url = url.slice(0, -1).replace(/[.,;:!?'"]+$/, "");
  return url;
}

function messageElements(messages) {
  const fragment = document.createDocumentFragment();
  for (const m of messages) fragment.appendChild(messageElement(m));
  return fragment;
}

async function loadOlder() {
  const state = past;
  if (!current || !state || state.loading || !state.available
      || state.before === 0) return;
  const id = current;
  state.loading = true;
  state.failed = false;
  renderHistoryBar();
  try {
    for (let i = 0; i < MAX_EMPTY_STRETCHES; i++) {
      const data = await fetchPast(
        id, state.before === null ? {} : { before: state.before });
      if (state !== past) return;
      if (!data.available) { state.available = false; break; }
      state.before = data.before;
      if (state.after === null) state.after = data.after;
      state.session = data.session;
      state.size = data.size;
      state.redacted = data.redacted;
      applyViewMode();
      if (data.messages.length) { prependMessages(data.messages); break; }
      if (state.before === 0) break;
    }
  } catch (e) {
    if (state !== past) return;
    state.failed = true;
  }
  state.loading = false;
  renderHistoryBar();
}

function prependMessages(messages) {
  keepingView(() => {
    $("messages").prepend(messageElements(messages));
  });
}

// Runs CHANGE, which adds content above the view, leaving what is on
// screen where it is.
function keepingView(change) {
  const out = $("output");
  const height = out.scrollHeight;
  const top = out.scrollTop;
  change();
  out.scrollTop = top + out.scrollHeight - height;
}

function appendMessages(messages, replace) {
  const box = $("messages");
  if (replace) box.replaceChildren();
  box.append(messageElements(messages));
}

function renderHistoryBar() {
  const state = past;
  const older = $("older");
  keepingView(() => {
    $("history-bar").classList.toggle(
      "shown", state.failed || (state.available && state.before !== null));
    older.hidden = state.before === 0;
    older.disabled = state.loading;
    older.textContent = state.failed ? "Retry" : "Load older";
    $("history-note").textContent = historyNote(state);
  });
}

function historyNote(state) {
  if (state.failed) return "Could not load the history.";
  const warning = state.redacted ? "" : "Secrets are not redacted. ";
  if (state.before === 0) return warning + "Start of the conversation.";
  const percent = Math.max(1, Math.round(
    100 * (state.size - state.before) / state.size));
  return warning + "Showing the last " + percent + "% of the transcript.";
}

function onOutputScroll() {
  if (past && !past.failed && $("output").scrollTop < 300) loadOlder();
}

function schedule() {
  clearInterval(timer);
  if (document.hidden) return;
  timer = current ? setInterval(() => refreshSession(false), 1500)
                  : setInterval(refreshList, 3000);
}

async function sendKey(key) {
  if (!current) return;
  try {
    await api("/api/key", { id: current, key });
    setTimeout(() => refreshSession(true), 300);
  } catch (e) { alertError(e); }
}

async function sendText() {
  const area = $("text");
  const text = area.value;
  if (!current || !text.trim()) return;
  $("send").disabled = true;
  try {
    await api("/api/send", { id: current, text });
    area.value = "";
    autosize();
    setTimeout(() => refreshSession(true), 400);
  } catch (e) {
    alertError(e);
  } finally {
    $("send").disabled = false;
  }
}

let picked = null;

function pct(v) { return v == null ? "–" : Math.round(v) + "%"; }

function choiceMeta(c, sessionAccount, selected) {
  const tags = [];
  if (c.name === sessionAccount) tags.push("this session");
  if (c.name === selected) tags.push("selected");
  if (c.pool) return [...tags, "pool: " + c.members.join(", ")].join(" · ");
  if (!c.loggedIn) tags.push("logged out");
  else if (c.limited) tags.push("at limit");
  tags.push("week " + pct(c.weekly) + ", session " + pct(c.session) +
            (c.stale ? " (stale)" : ""));
  return tags.join(" · ");
}

async function openRestart() {
  if (!current) return;
  picked = null;
  $("restart-go").disabled = true;
  $("restart-go").textContent = "Restart";
  $("choices").replaceChildren();
  $("restart-note").textContent = "Loading…";
  $("restart-sheet").classList.add("open");
  try {
    const data = await api("/api/accounts?id=" + encodeURIComponent(current));
    $("restart-note").textContent =
      "The chosen account also becomes the default for new sessions.";
    for (const c of data.choices) {
      const b = document.createElement("button");
      b.className = "choice";
      b.disabled = !c.pool && !c.loggedIn;
      const main = document.createElement("div");
      main.className = "main";
      const name = document.createElement("div");
      name.textContent = c.name;
      const meta = document.createElement("div");
      meta.className = "meta" + (c.limited || (!c.pool && !c.loggedIn) ? " limited" : "");
      meta.textContent = choiceMeta(c, data.account, data.selected);
      main.append(name, meta);
      b.append(main);
      b.addEventListener("click", () => {
        picked = c.name;
        for (const other of $("choices").children)
          other.classList.toggle("picked", other === b);
        $("restart-go").disabled = false;
        $("restart-go").textContent = "Restart with " + c.name;
      });
      $("choices").appendChild(b);
    }
  } catch (e) {
    $("restart-note").textContent = "Error: " + e.message;
  }
}

function closeSheets() {
  for (const sheet of document.querySelectorAll(".sheet"))
    sheet.classList.remove("open");
}

function followSession(id) {
  closeSheets();
  current = id;
  resetSessionView();
  setTimeout(() => loadOlder().then(() => refreshSession(true)), 1500);
}

async function openNew() {
  if (!current) return;
  $("backends").replaceChildren();
  $("new-note").textContent = "Loading…";
  $("new-sheet").classList.add("open");
  try {
    const data = await api("/api/backends?id=" + encodeURIComponent(current));
    $("new-note").textContent = "In " + data.directory;
    for (const c of data.choices) {
      const b = document.createElement("button");
      b.className = "choice";
      b.textContent = c.label;
      b.addEventListener("click", () => doNew(c, b));
      $("backends").appendChild(b);
    }
  } catch (e) {
    $("new-note").textContent = "Error: " + e.message;
  }
}

async function doNew(choice, button) {
  for (const b of $("backends").children) b.disabled = true;
  button.textContent = "Starting " + choice.label + "…";
  try {
    const data = await api("/api/new", { id: current, backend: choice.name });
    history.replaceState({ session: data.id }, "");
    followSession(data.id);
  } catch (e) {
    $("new-note").textContent = "Error: " + e.message;
    button.textContent = choice.label;
    for (const b of $("backends").children) b.disabled = false;
  }
}

function openExit() {
  if (!current) return;
  $("exit-note").textContent = $("session-title").textContent;
  $("exit-skills").disabled = $("exit-plain").disabled = false;
  $("exit-sheet").classList.add("open");
}

async function doExit(skills) {
  $("exit-skills").disabled = $("exit-plain").disabled = true;
  try {
    await api("/api/exit", { id: current, skills });
    closeSheets();
    setTimeout(() => refreshSession(true), 800);
  } catch (e) {
    $("exit-note").textContent = "Error: " + e.message;
    $("exit-skills").disabled = $("exit-plain").disabled = false;
  }
}

async function doRestart() {
  if (!current || !picked) return;
  $("restart-go").disabled = true;
  $("restart-go").textContent = "Restarting…";
  try {
    const data = await api("/api/restart", { id: current, account: picked });
    followSession(data.id);
  } catch (e) {
    $("restart-note").textContent = "Error: " + e.message;
    $("restart-go").textContent = "Restart with " + picked;
    $("restart-go").disabled = false;
  }
}

function alertError(e) {
  const badge = $("session-badge");
  badge.className = "badge";
  badge.textContent = "error";
  const text = "[agent-remote] " + e.message;
  if (past && hasTranscript()) {
    $("messages").append(messageElement({ role: "tool", text }));
    scrollOutputToBottom();
  } else {
    $("live").textContent += "\n\n" + text;
  }
}

function autosize() {
  const area = $("text");
  area.style.height = "auto";
  area.style.height = area.scrollHeight + "px";
}

for (const keys of KEY_GROUPS) {
  const group = document.createElement("div");
  group.className = "key-group";
  for (const [key, label] of keys) {
    const b = document.createElement("button");
    b.className = "key";
    b.textContent = label;
    b.addEventListener("click", () => sendKey(key));
    group.appendChild(b);
  }
  $("keys").appendChild(group);
}
$("send").addEventListener("click", sendText);
$("text").addEventListener("input", autosize);
$("back").addEventListener("click", () => history.back());
$("wrap").addEventListener("click", () => $("session-view").classList.toggle("nowrap"));
$("older").addEventListener("click", loadOlder);
$("output").addEventListener("scroll", onOutputScroll, { passive: true });
$("restart").addEventListener("click", openRestart);
$("restart-cancel").addEventListener("click", closeSheets);
$("restart-go").addEventListener("click", doRestart);
$("new").addEventListener("click", openNew);
$("exit").addEventListener("click", openExit);
$("exit-skills").addEventListener("click", () => doExit(true));
$("exit-plain").addEventListener("click", () => doExit(false));
for (const sheet of document.querySelectorAll(".sheet")) {
  sheet.addEventListener("click", (e) => { if (e.target === sheet) closeSheets(); });
  for (const b of sheet.querySelectorAll(".cancel"))
    b.addEventListener("click", closeSheets);
}
window.addEventListener("popstate", () => { if (current) closeSession(); });
document.addEventListener("visibilitychange", () => {
  schedule();
  if (!document.hidden) current ? refreshSession(false) : refreshList();
});
refreshList();
schedule();
</script>
</body>
</html>
